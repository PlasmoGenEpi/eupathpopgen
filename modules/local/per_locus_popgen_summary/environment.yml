---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::r-base=4.5
  - bioconda::r-pgecore=0.1.0
  - conda-forge::r-ape
  - conda-forge::r-pegas
  - bioconda::bioconductor-biostrings
  - bioconda::bioconductor-pwalign
  # bioconductor-msa has no osx-arm64 build, so it is omitted here and installed at
  # runtime when missing; the containers include it.
  - conda-forge::r-biocmanager
  - bioconda::muscle=5.1
