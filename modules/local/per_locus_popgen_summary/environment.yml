  - conda-forge::r-dplyr
  - conda-forge::r-magrittr
  - conda-forge::r-optparse
  - conda-forge::r-purrr
  - conda-forge::r-readr
  - conda-forge::r-remotes
  - conda-forge::r-rlang
  - conda-forge::r-stringr
  - conda-forge::r-tibble
  - conda-forge::r-tidyr
  - conda-forge::r-ape
  - conda-forge::r-pegas
  - bioconda::muscle=5.1
